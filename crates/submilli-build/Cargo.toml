[package]
name = "submilli-build"
description = "Builds, installs and reads Submilli packages: the artifacts submilli-engine loads"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["submilli", "packages", "build", "agents"]
categories = ["development-tools::build-utils"]
publish = true
# Tests and their snapshots stay in the repository; the package is the library.
exclude = ["tests/**", "**/snapshots/**"]

[lints]
workspace = true

[dependencies]
interpreter = { workspace = true }
submilli-policy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yml = { workspace = true }
toml = { workspace = true }

tempfile = { workspace = true }
