[package]
name = "submilli-policy"
description = "The Submilli policy engine: permission rules and their filter language, session variables, and auth-proxy injection"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["submilli", "policy", "permissions", "agents"]
categories = ["config"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
regex = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
submilli-engine = { version = "0.3.0", path = "../interpreter", optional = true }
url = { workspace = true, optional = true }

[features]
# Adapters from the policy types to the engine's host-service traits.
engine = ["dep:submilli-engine", "dep:url"]

[dev-dependencies]
submilli-engine = { path = "../interpreter" }
tokio = { workspace = true, features = ["rt", "macros"] }
