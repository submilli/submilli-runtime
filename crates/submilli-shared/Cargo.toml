[package]
name = "submilli-shared"
description = "Shared embedding, MCP, authentication and tooling support for the Submilli runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
# Tests and their snapshots stay in the repository; the package is the library.
exclude = ["tests/**", "**/snapshots/**"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
interpreter = { workspace = true }
submilli-blueprint.workspace = true
submilli-build.workspace = true
submilli-policy = { workspace = true, features = ["engine"] }
anyhow = { workspace = true }
sha2 = "0.10"
hmac = "0.12"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
sse-stream = "=0.2.6"
chacha20poly1305 = { workspace = true }
url = { workspace = true }
http = { workspace = true }
rmcp = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
ureq = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }

rustls.workspace = true
webpki-roots.workspace = true
x509-parser.workspace = true

[dev-dependencies]
rcgen.workspace = true
httpmock = { workspace = true }
insta = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt", "rt-multi-thread"] }
