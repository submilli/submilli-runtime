kind: blueprint
name: browserbase-gated-test
packages:
  - '@submilli/browserbase'
default: deny
permissions:
  main:
    - capability: browserbase.com/fetch
      filter: host == "evil.test"
      action: deny
    - capability: browserbase.com/fetch
      filter: host == "example.com" and proxies == false and allowRedirects == false and allowInsecureSsl == false and contextId == ""
      action: allow
    - capability: browserbase.com/stagehand.start
      filter: model == "google/gemini-2.5-flash" and proxies == false and verified == false and solveCaptchas == false and keepAlive == false and region == "us-west-2" and timeoutSeconds == 300 and contextId == "" and persistContext == false
      action: allow
    - capability: browserbase.com/stagehand.navigate
      filter: host == "evil.test"
      action: deny
    - capability: browserbase.com/stagehand.navigate
      filter: sessionId == "sess_1" and host == "example.com"
      action: allow
    - capability: browserbase.com/delegatedFetch
      action: allow
  # Deliberate sentinel: permitted calls must reach secrets.get, which is
  # denied here before a key can be read or a network request can happen.
  '@submilli/browserbase': []
