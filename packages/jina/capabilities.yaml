namespace: submilli
provides:
- name: jina.ai/read
  description: 'Read a URL through the Reader and stream the markdown straight to a VFS file — the body never enters Wasm memory or a JSON envelope, so payload size is bound by disk, not the fuel budget. Prefer this over `read` for large pages: pair it with the host''s batched file-read to consume the result incrementally.'
  fields:
    host:
      type: string
- name: jina.ai/search
  description: Search the web and stream the concatenated markdown results straight to a VFS file, JSON-free (see `downloadRead`). Prefer this over `search` when the result set is large.
  fields: {}
requires:
- capability: fs.write
- capability: http.download
  filter: host == "r.jina.ai"
- capability: http.download
  filter: host == "s.jina.ai"
- capability: http.post
  filter: host == "r.jina.ai" and path == "/"
- capability: http.post
  filter: host == "s.jina.ai" and path == "/"
- capability: secrets.get
  filter: name == "JINA_API_KEY"
