namespace: submilli
provides:
- name: jina.ai/read
  description: Read a URL through the Reader, returning Jina's LLM-friendly markdown.
  fields:
    host:
      type: string
- name: jina.ai/search
  description: Search the web, returning the top results concatenated as markdown.
  fields: {}
requires:
- capability: fs.write
- capability: http.download
  filter: host == "r.jina.ai"
- capability: http.download
  filter: host == "s.jina.ai"
- capability: http.post
  filter: host == "r.jina.ai" and path == "/"
- capability: http.post
  filter: host == "s.jina.ai" and path == "/"
- capability: secrets.get
  filter: name == "JINA_API_KEY"
