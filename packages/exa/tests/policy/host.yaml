kind: blueprint
name: exa-host-test
packages:
  - '@submilli/exa'
default: deny
permissions:
  main:
    - capability: exa.ai/contents
      filter: host == "evil.test"
      action: deny
    - capability: exa.ai/contents
      action: allow
  # Deliberate sentinel: permitted requests must reach secrets.get, which is
  # denied here before a key can be read or a network request can happen.
  '@submilli/exa': []
