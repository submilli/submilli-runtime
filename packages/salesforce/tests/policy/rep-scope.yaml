# Run by `policy_scripts_pass_under_their_blueprints` in crates/submilli/tests/package_policy.rs.
# A sales rep's agent: it reads only its own pipeline, may not see amounts through a query,
# logs tasks, opens cases, and has no raw SOQL. The package is granted nothing, so an
# allowed call stops when the package reads the org's URL.
kind: blueprint
name: salesforce-rep-scope-test
packages:
  - '@submilli/salesforce'
default: deny
permissions:
  main:
    - capability: salesforce.com/opportunities.find
      filter: ownerId == "005000000000001AAA"
      action: allow
    - capability: salesforce.com/accounts.find
      filter: ownerId == "005000000000001AAA"
      action: allow
    - capability: salesforce.com/query.run
      filter: object == "opportunity" and not (fields contains "amount")
      action: allow
    - capability: salesforce.com/query.aggregate
      filter: object == "opportunity"
      action: allow
    - capability: salesforce.com/query.search
      filter: not (objects contains "user")
      action: allow
    - capability: salesforce.com/records.create
      filter: object == "task" and ownerId == ""
      action: allow
    - capability: salesforce.com/cases.create
      filter: not (fields contains "ownerid")
      action: allow
