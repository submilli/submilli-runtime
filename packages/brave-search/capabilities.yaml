namespace: submilli
provides:
- name: brave.com/context
  description: Retrieve extracted web passages with their source URLs.
  fields: {}
- name: brave.com/search
  description: Search one page of web results. Credentials are supplied internally.
  fields: {}
requires:
- capability: http.get
  filter: host == "api.search.brave.com"
- capability: secrets.get
  filter: name == "BRAVE_SEARCH_API_KEY"
