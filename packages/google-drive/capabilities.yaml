namespace: submilli
provides:
- name: fs.write
  description: Stream a Drive file or native-document export into the VFS. The caller's `fs.write` rule checks the normalized destination and byte limit. The package capability retains the caller's original `path` for compatibility.
  fields:
    max_bytes:
      type: number
    path:
      type: string
- name: submilli/google-drive.copyFile
  description: Copy a file with an optional new name or parent. `parentId` in the check is the destination folder, or "" when the copy stays beside the source.
  fields:
    fileId:
      type: string
    parentId:
      type: string
- name: submilli/google-drive.createFolder
  description: Create a folder, optionally under a parent.
  fields:
    parentId:
      type: string
- name: submilli/google-drive.downloadFile
  description: Stream a Drive file or native-document export into the VFS. The caller's `fs.write` rule checks the normalized destination and byte limit. The package capability retains the caller's original `path` for compatibility.
  fields:
    fileId:
      type: string
    path:
      type: string
- name: submilli/google-drive.getFile
  description: Fetch one Drive file, returning null when absent.
  fields:
    fileId:
      type: string
- name: submilli/google-drive.listPermissions
  description: List permissions on a Drive file.
  fields:
    fileId:
      type: string
- name: submilli/google-drive.listRecentFiles
  description: List recently modified, non-trashed files.
  fields: {}
- name: submilli/google-drive.moveFile
  description: Move a file to one parent, removing its current parents.
  fields:
    fileId:
      type: string
    parentId:
      type: string
- name: submilli/google-drive.readText
  description: Read a text file or export a Google Doc as UTF-8 text.
  fields:
    fileId:
      type: string
- name: submilli/google-drive.removePermission
  description: Remove a permission from a Drive file.
  fields:
    fileId:
      type: string
- name: submilli/google-drive.renameFile
  description: Rename a file.
  fields:
    fileId:
      type: string
- name: submilli/google-drive.restoreFile
  description: Restore a trashed file.
  fields:
    fileId:
      type: string
- name: submilli/google-drive.searchFiles
  description: Search Drive files with structured filters plus an optional raw Drive query. Shared Drive searches set `driveId` and use `corpora=drive`.
  fields: {}
- name: submilli/google-drive.shareFile
  description: Share a file with exactly one user, group, domain, or anyone principal. `principal` is the lowercased email address for "user" and "group", the lowercased domain for "domain", and "anyone" for "anyone". An input that sets `emailAddress`, `domain`, or `allowFileDiscovery` for a type that does not use it is refused. `sendNotificationEmail` is true for a user or group unless set to false; for the other types, which Drive does not email, it is ignored and false. `allowFileDiscovery` is false when unset.
  fields:
    allowFileDiscovery:
      type: boolean
    fileId:
      type: string
    principal:
      type: string
    role:
      type: string
    sendNotificationEmail:
      type: boolean
    type:
      type: string
- name: submilli/google-drive.trashFile
  description: Move a file to trash. This package intentionally has no permanent-delete API.
  fields:
    fileId:
      type: string
- name: submilli/google-drive.uploadFile
  description: Upload a VFS file using Google's resumable protocol and fixed 8 MiB chunks. `parentId` in the check is the destination folder as the caller named it, or "" when the caller names none and the file goes to My Drive root. The alias `root` names that folder too, so a rule on `parentId` lists the folders it allows.
  fields:
    driveId:
      type: string
    parentId:
      type: string
    path:
      type: string
requires:
- capability: fs.read
- capability: fs.stat
- capability: fs.write
- capability: http.delete
  filter: host == "www.googleapis.com"
- capability: http.download
  filter: host == "www.googleapis.com"
- capability: http.get
  filter: host == "www.googleapis.com"
- capability: http.patch
  filter: host == "www.googleapis.com"
- capability: http.post
  filter: host == "www.googleapis.com"
- capability: http.put
  filter: host == "www.googleapis.com"
- capability: secrets.get
  filter: name == "GOOGLE_ACCESS_TOKEN"
