kind: blueprint
name: google-drive-download-path-test
packages:
  - '@submilli/google-drive'
default: deny
permissions:
  main:
    - capability: submilli/google-drive.downloadFile
      filter: path != "/downloads/business-denied"
      action: allow
    - capability: fs.write
      filter: path glob "/downloads/*" and max_bytes <= 20000000
      action: allow
  # An allowed path stops before credentials or network access.
  '@submilli/google-drive': []
