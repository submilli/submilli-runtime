namespace: submilli
provides:
- name: submilli/google-calendar.agenda
  description: Build a bounded chronological agenda across explicit calendars or up to ten visible calendars.
  fields: {}
- name: submilli/google-calendar.createEvent
  description: Create a Calendar event and optionally request a Google Meet conference. `attendees` in the check holds each attendee's address once, in lowercase. `sendUpdates` is "none" when unset.
  fields:
    attendees:
      type: string[]
    calendarId:
      type: string
    sendUpdates:
      type: string
- name: submilli/google-calendar.deleteEvent
  description: Delete an event. This is idempotent when the event is already absent. `sendUpdates` in the check is "none" when unset.
  fields:
    calendarId:
      type: string
    sendUpdates:
      type: string
- name: submilli/google-calendar.findFreeTime
  description: Find bounded candidate slots by merging busy intervals from multiple calendars.
  fields:
    calendarIds:
      type: string[]
- name: submilli/google-calendar.getEvent
  description: Fetch one event, returning null when it does not exist.
  fields:
    calendarId:
      type: string
- name: submilli/google-calendar.listCalendars
  description: List calendars visible to the authenticated account.
  fields: {}
- name: submilli/google-calendar.listEvents
  description: List one page of events. The default calendar is `primary`.
  fields:
    calendarId:
      type: string
- name: submilli/google-calendar.queryFreeBusy
  description: Query busy intervals for explicit calendars and a bounded time range.
  fields:
    calendarIds:
      type: string[]
- name: submilli/google-calendar.respondToEvent
  description: Set the authenticated attendee's response status on an event.
  fields:
    calendarId:
      type: string
    response:
      type: string
- name: submilli/google-calendar.updateEvent
  description: 'Patch an event. Omitted fields remain unchanged; empty attendees clears attendees. `attendees` in the check holds the address of each attendee the event has after the update, once, in lowercase: the replacement list, or the event''s current attendees when the patch has none. The event is read for that before the check. `sendUpdates` is "none" when unset.'
  fields:
    attendees:
      type: string[]
    calendarId:
      type: string
    notificationRecipients:
      type: string[]
    removedAttendees:
      type: string[]
    sendUpdates:
      type: string
requires:
- capability: http.delete
  filter: host == "www.googleapis.com"
- capability: http.get
  filter: host == "www.googleapis.com"
- capability: http.patch
  filter: host == "www.googleapis.com"
- capability: http.post
  filter: host == "www.googleapis.com"
- capability: http.post
  filter: host == "www.googleapis.com" and path == "/calendar/v3/freeBusy"
- capability: secrets.get
  filter: name == "GOOGLE_ACCESS_TOKEN"
