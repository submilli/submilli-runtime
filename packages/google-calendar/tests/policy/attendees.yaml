kind: blueprint
name: google-calendar-attendees-test
packages:
  - '@submilli/google-calendar'
default: deny
permissions:
  main:
    - capability: submilli/google-calendar.createEvent
      filter: calendarId == "primary" and sendUpdates == "none" and not (attendees contains "blocked@example.com")
      action: allow
    - capability: submilli/google-calendar.updateEvent
      filter: calendarId == "primary" and sendUpdates == "none" and not (attendees contains "blocked@example.com")
      action: allow
    - capability: submilli/google-calendar.deleteEvent
      filter: calendarId == "primary" and sendUpdates == "none"
      action: allow
  # Deliberate sentinel: an allowed call must reach secrets.get, which is
  # denied here before a token can be read or a request can be sent.
  '@submilli/google-calendar': []
