kind: blueprint
name: gmail-request-values-test
packages:
  - '@submilli/gmail'
default: deny
secrets:
  GOOGLE_ACCESS_TOKEN:
    store: policy-token
permissions:
  main:
    - capability: submilli/gmail.sendEmail
      filter: not (recipients contains "blocked@example.com")
      action: allow
    - capability: submilli/gmail.createDraft
      filter: not (recipients contains "blocked@example.com")
      action: allow
  '@submilli/gmail':
    - capability: secrets.get
      filter: name == "GOOGLE_ACCESS_TOKEN"
      action: allow
    # No `http.post` rule: every request falls to the default, so none is sent.
