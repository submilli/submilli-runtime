namespace: submilli
provides:
- name: linear.app/createAgentActivity
  description: Emit progress, a question, a final response, or an error.
  fields:
    teamId:
      type: string
- name: linear.app/createAgentSessionOnComment
  description: Proactively create a session on an existing comment using the app's token.
  fields:
    teamId:
      type: string
- name: linear.app/createAgentSessionOnIssue
  description: Proactively create a session on an issue using the installed app's token.
  fields:
    teamId:
      type: string
- name: linear.app/createComment
  description: Create a comment on an issue; returns the created comment. The issue is read first, so the check carries `teamId`, the team the issue belongs to, `labelIds`, the labels it has now, and `projectId`, its project now (null when none).
  fields:
    labelIds:
      type: string[]
    projectId:
      type: string
    teamId:
      type: string
- name: linear.app/createIssue
  description: Create an issue; returns the created issue. `labelIds` in the check are the labels it is created with (empty when none), and `projectId` its project (null when none).
  fields:
    labelIds:
      type: string[]
    projectId:
      type: string
    teamId:
      type: string
- name: linear.app/findSimilarIssues
  description: Find open issues whose titles resemble a text, for duplicate detection without reading other issues. Looks in a team, at issues that carry a label or belong to a project (either, when both are given). The package compares titles itself and returns only UUIDs and scores, never titles, descriptions or any other content. Similarity is the Dice coefficient of significant words (case-insensitive, stop words ignored). Completed and canceled issues are skipped. Reads up to 10,000 issues. `labelId` and `projectId` in the check are null when not given.
  fields:
    labelId:
      type: string
    projectId:
      type: string
    teamId:
      type: string
- name: linear.app/getAgentSession
  description: Fetch a Linear agent session by UUID.
  fields:
    teamId:
      type: string
- name: linear.app/getIssue
  description: Fetch one issue by UUID; null when not found.
  fields:
    teamId:
      type: string
- name: linear.app/getTeam
  description: Fetch one team by UUID; null when not found.
  fields:
    teamId:
      type: string
      description: Team UUID.
- name: linear.app/getViewer
  description: Fetch the authenticated user (whoever owns the API token).
  fields: {}
- name: linear.app/listAgentActivities
  description: Read a page of session activities, including user prompts and stop signals.
  fields:
    teamId:
      type: string
- name: linear.app/listComments
  description: Read comments, including parent IDs for threaded replies.
  fields:
    teamId:
      type: string
- name: linear.app/listIssues
  description: List issues, optionally filtered and paginated. `teamId` in the check is the filter's team, or null when the filter names no team; `labelId` is the filter's label, or null when it names none.
  fields:
    labelId:
      type: string
    teamId:
      type: string
- name: linear.app/listProjects
  description: List projects, paginated.
  fields: {}
- name: linear.app/listTeams
  description: List teams, paginated.
  fields: {}
- name: linear.app/listUsers
  description: List users, paginated.
  fields: {}
- name: linear.app/updateAgentSession
  description: Update session links, summary, or the complete plan.
  fields:
    teamId:
      type: string
- name: linear.app/updateIssue
  description: Update an issue by UUID; returns the updated issue. The issue is read first, so the check carries `teamId`, the team the issue belongs to. `projectId` is the project the update moves the issue to, or null when the update leaves the project unchanged.
  fields:
    projectId:
      type: string
    teamId:
      type: string
requires:
- capability: http.post
  filter: host == "api.linear.app" and path == "/graphql"
- capability: secrets.get
  filter: name == "LINEAR_API_KEY"
