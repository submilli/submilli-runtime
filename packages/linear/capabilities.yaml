namespace: submilli
provides:
- name: linear.app/createAgentActivity
  description: Emit progress, a question, a final response, or an error.
  fields: {}
- name: linear.app/createAgentSessionOnComment
  description: Proactively create a session on an existing comment using the app's token.
  fields: {}
- name: linear.app/createAgentSessionOnIssue
  description: Proactively create a session on an issue using the installed app's token.
  fields: {}
- name: linear.app/createComment
  description: Create a comment on an issue; returns the created comment.
  fields: {}
- name: linear.app/createIssue
  description: Create an issue; returns the created issue.
  fields:
    teamId:
      type: string
- name: linear.app/getAgentSession
  description: Fetch a Linear agent session by UUID.
  fields: {}
- name: linear.app/getIssue
  description: Fetch one issue by UUID; null when not found.
  fields: {}
- name: linear.app/getTeam
  description: Fetch one team by UUID; null when not found.
  fields:
    teamId:
      type: string
- name: linear.app/getViewer
  description: Fetch the authenticated user (whoever owns the API token).
  fields: {}
- name: linear.app/listAgentActivities
  description: Read a page of session activities, including user prompts and stop signals.
  fields: {}
- name: linear.app/listComments
  description: Read comments, including parent IDs for threaded replies.
  fields: {}
- name: linear.app/listIssues
  description: List issues, optionally filtered and paginated.
  fields:
    teamId:
      type: string
- name: linear.app/listProjects
  description: List projects, paginated.
  fields: {}
- name: linear.app/listTeams
  description: List teams, paginated.
  fields: {}
- name: linear.app/listUsers
  description: List users, paginated.
  fields: {}
- name: linear.app/updateAgentSession
  description: Update session links, summary, or the complete plan.
  fields: {}
- name: linear.app/updateIssue
  description: Update an issue by UUID; returns the updated issue.
  fields: {}
requires:
- capability: http.post
  filter: host == "api.linear.app" and path == "/graphql"
- capability: secrets.get
  filter: name == "LINEAR_API_KEY"
