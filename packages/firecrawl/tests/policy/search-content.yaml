kind: blueprint
name: firecrawl-search-content-test
packages:
  - '@submilli/firecrawl'
default: deny
permissions:
  main:
    - capability: firecrawl.dev/search
      filter: limit <= 2
      action: allow
    - capability: firecrawl.dev/search.scrape
      action: allow
    - capability: firecrawl.dev/delegatedFetch
      action: allow
  '@submilli/firecrawl': []
