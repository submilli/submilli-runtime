kind: blueprint
name: github-request-values-test
packages:
  - '@submilli/github'
default: deny
secrets:
  GITHUB_TOKEN:
    store: policy-token
permissions:
  main:
    - capability: github.com/repositories.get
      filter: owner == "allowed-org"
      action: allow
    - capability: github.com/branches.list
      filter: owner == "allowed-org"
      action: allow
    - capability: github.com/pulls.get
      filter: owner == "allowed-org"
      action: allow
    - capability: github.com/contents.readFile
      filter: owner == "allowed-org"
      action: allow
  '@submilli/github':
    - capability: secrets.get
      filter: name == "GITHUB_TOKEN"
      action: allow
    # No `http.get` rule: every request falls to the default, so none is sent.
