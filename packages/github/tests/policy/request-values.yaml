kind: blueprint
name: github-request-values-test
packages:
  - '@submilli/github'
default: deny
secrets:
  # Not a credential: a placeholder read from a file beside this blueprint, so the
  # run touches neither the secret store nor the environment. The path is relative
  # to the repository root, where the policy test runs.
  GITHUB_TOKEN:
    file: packages/github/tests/policy/fake-token.txt
permissions:
  main:
    - capability: github.com/repositories.get
      filter: owner == "allowed-org"
      action: allow
    - capability: github.com/branches.list
      filter: owner == "allowed-org"
      action: allow
    - capability: github.com/pulls.get
      filter: owner == "allowed-org"
      action: allow
    - capability: github.com/contents.readFile
      filter: owner == "allowed-org"
      action: allow
  '@submilli/github':
    - capability: secrets.get
      filter: name == "GITHUB_TOKEN"
      action: allow
    # No request is sent: `ask-human` refuses like `deny`, with a reason of its own.
    # That reason tells the script the request was for the approved repository, and
    # a request for any other falls to the default and its reason.
    - capability: http.get
      filter: host == "api.github.com" and (path == "/repos/allowed-org/repo.js" or path glob "/repos/allowed-org/repo.js/*")
      action: ask-human
