namespace: submilli
provides:
- name: github.com/branches.create
  description: Create a branch at an exact commit SHA.
  fields:
    branch:
      type: string
    owner:
      type: string
    repo:
      type: string
- name: github.com/branches.delete
  description: Delete a repository branch.
  fields:
    branch:
      type: string
    owner:
      type: string
    repo:
      type: string
- name: github.com/branches.get
  description: Retrieve a branch, or null when it does not exist.
  fields:
    branch:
      type: string
    owner:
      type: string
    repo:
      type: string
- name: github.com/branches.list
  description: List repository branches.
  fields:
    owner:
      type: string
    repo:
      type: string
- name: github.com/code.search
  description: Search code within one repository.
  fields:
    owner:
      type: string
    repo:
      type: string
- name: github.com/commits.create
  description: Commit multiple file writes and deletions with optimistic branch concurrency.
  fields:
    branch:
      type: string
    owner:
      type: string
    repo:
      type: string
- name: github.com/commits.get
  description: Retrieve one commit with configurable detail.
  fields:
    owner:
      type: string
    ref:
      type: string
    repo:
      type: string
- name: github.com/commits.list
  description: List repository commits.
  fields:
    owner:
      type: string
    repo:
      type: string
- name: github.com/contents.listDirectory
  description: List direct entries in a repository directory.
  fields:
    owner:
      type: string
    path:
      type: string
    ref:
      type: string
    repo:
      type: string
- name: github.com/contents.readFile
  description: Read a repository file as bytes. `ref` in the check is the branch, tag, or commit the caller names, or null for the repository's default branch.
  fields:
    owner:
      type: string
    path:
      type: string
    ref:
      type: string
    repo:
      type: string
- name: github.com/contents.readTextFile
  description: Read a repository file as strict UTF-8 text.
  fields:
    owner:
      type: string
    path:
      type: string
    ref:
      type: string
    repo:
      type: string
- name: github.com/issueComments.create
  description: Add an issue comment.
  fields:
    number:
      type: number
    owner:
      type: string
    repo:
      type: string
- name: github.com/issueComments.list
  description: List issue comments.
  fields:
    number:
      type: number
    owner:
      type: string
    repo:
      type: string
- name: github.com/issues.create
  description: Create an issue.
  fields:
    owner:
      type: string
    repo:
      type: string
- name: github.com/issues.get
  description: Retrieve an issue, or null when absent.
  fields:
    number:
      type: number
    owner:
      type: string
    repo:
      type: string
- name: github.com/issues.list
  description: List true issues using cursor pagination.
  fields:
    owner:
      type: string
    repo:
      type: string
- name: github.com/issues.search
  description: Search issues within one repository.
  fields:
    owner:
      type: string
    repo:
      type: string
- name: github.com/issues.update
  description: Update an issue.
  fields:
    number:
      type: number
    owner:
      type: string
    repo:
      type: string
- name: github.com/labels.list
  description: List labels in a repository.
  fields:
    owner:
      type: string
    repo:
      type: string
- name: github.com/pullComments.create
  description: Add a general pull request comment.
  fields:
    number:
      type: number
    owner:
      type: string
    repo:
      type: string
- name: github.com/pullComments.list
  description: List general pull request comments.
  fields:
    number:
      type: number
    owner:
      type: string
    repo:
      type: string
- name: github.com/pullFiles.list
  description: List files changed by a pull request.
  fields:
    number:
      type: number
    owner:
      type: string
    repo:
      type: string
- name: github.com/pullReviews.create
  description: Create a pull request review.
  fields:
    number:
      type: number
    owner:
      type: string
    repo:
      type: string
- name: github.com/pullReviews.list
  description: List pull request reviews.
  fields:
    number:
      type: number
    owner:
      type: string
    repo:
      type: string
- name: github.com/pulls.create
  description: Create a pull request.
  fields:
    base:
      type: string
    head:
      type: string
    owner:
      type: string
    repo:
      type: string
- name: github.com/pulls.diff
  description: Retrieve a pull request unified diff.
  fields:
    number:
      type: number
    owner:
      type: string
    repo:
      type: string
- name: github.com/pulls.get
  description: Retrieve a pull request, or null when absent.
  fields:
    number:
      type: number
    owner:
      type: string
    repo:
      type: string
- name: github.com/pulls.list
  description: List pull requests.
  fields:
    owner:
      type: string
    repo:
      type: string
- name: github.com/pulls.merge
  description: Merge a pull request without force.
  fields:
    number:
      type: number
    owner:
      type: string
    repo:
      type: string
- name: github.com/pulls.search
  description: Search pull requests within one repository.
  fields:
    owner:
      type: string
    repo:
      type: string
- name: github.com/pulls.update
  description: Update a pull request. `base` in the check is the branch the update retargets the pull request to, or null when it leaves the base as it is.
  fields:
    base:
      type: string
    number:
      type: number
    owner:
      type: string
    repo:
      type: string
- name: github.com/rateLimit.get
  description: Retrieve current REST, search, and GraphQL rate limits.
  fields: {}
- name: github.com/releases.getLatest
  description: Retrieve the latest release, or null when the repository has none.
  fields:
    owner:
      type: string
    repo:
      type: string
- name: github.com/releases.list
  description: List repository releases.
  fields:
    owner:
      type: string
    repo:
      type: string
- name: github.com/repositories.get
  description: Retrieve repository metadata, or null when it does not exist.
  fields:
    owner:
      type: string
    repo:
      type: string
- name: github.com/repositories.search
  description: Search repositories visible to the token.
  fields: {}
- name: github.com/teamMembers.list
  description: List members of an organization team.
  fields:
    org:
      type: string
    teamSlug:
      type: string
- name: github.com/teams.list
  description: List teams visible to the authenticated user.
  fields: {}
- name: github.com/trees.get
  description: Retrieve a Git tree.
  fields:
    owner:
      type: string
    repo:
      type: string
    treeSha:
      type: string
- name: github.com/users.search
  description: Search GitHub users.
  fields: {}
- name: github.com/viewer.get
  description: Retrieve the authenticated GitHub user.
  fields: {}
requires:
- capability: http.delete
  filter: host == "api.github.com"
- capability: http.get
  filter: host == "api.github.com"
- capability: http.patch
  filter: host == "api.github.com"
- capability: http.post
  filter: host == "api.github.com"
- capability: http.post
  filter: host == "api.github.com" and path == "/graphql"
- capability: http.put
  filter: host == "api.github.com"
- capability: secrets.get
  filter: name == "GITHUB_TOKEN"
