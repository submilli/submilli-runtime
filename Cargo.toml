[workspace]
resolver = "3"
members = [
    "crates/conformance",
    "crates/interpreter",
    "crates/submilli",
    "crates/submilli-build",
    "crates/submilli-blueprint",
    "crates/submilli-shared",
    "crates/submilli-server",
]

[workspace.package]
version = "0.1.6"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/submilli/submilli-runtime"
publish = false

[workspace.dependencies]
wasmtime = { package = "submilli-wasm", version = "0.1.3", features = ["async"] }
wasm-encoder = "0.248"
wasmparser = "0.248"
wast = "248"
gimli = "0.33"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
insta = "1"
unicode-ident = "1"
unicode-normalization = "0.1"
base64 = "0.22"
chacha20poly1305 = "0.10"

# Server stack (introduced in SUB-154).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", default-features = false }
serde = { version = "1" }
serde_json = "1"
toml = "0.9.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
tower = { version = "0.5", default-features = false }
http-body-util = "0.1"
http = "1"
rmcp = { version = "1.7", default-features = false, features = ["server", "client", "macros", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "reqwest", "schemars"] }
futures = { version = "0.3", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
uuid = { version = "1", features = ["v4", "v7"] }
url = "2"
ipnet = "2"
percent-encoding = "2"
async-trait = "0.1"
pollster = "0.3"
serde_path_to_error = "0.1"
serde_yml = "0.0.12"
tempfile = "3"
# Capability-based filesystem sandboxing for the VFS (SUB-699 / SUB-775). Both are
# first-party to the same project and version in lockstep; `cap-fs-ext` supplies the
# portable symlink helper the recursive copy needs.
cap-std = "4"
cap-fs-ext = "4"
libc = "0.2"
httpmock = "0.7"
num-bigint = "0.4"
num-traits = "0.2"
flate2 = "1"
tar = "0.4"
zstd = "0.13"
regex = "1"
jiff = "0.2"
# default-features off to drop the `transport` feature's native-tls (→ openssl,
# which breaks static-musl cross-builds); same default set re-enabled with rustls.
sentry = { version = "0.48.2", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "release-health", "metrics", "reqwest", "rustls"] }

# Lints inherited by every crate via `[lints] workspace = true`.
# Two tiers:
#   deny  — the gate. `clippy::all` is already green workspace-wide; keep it that way.
#   warn  — the ratchet. Signals that drive cleanup (the simplify agent on touched
#           code; hotspot Linear issues for the long-function offenders). Non-breaking
#           today; promote a lint to deny once its count reaches zero.
# Thresholds live in clippy.toml.
[workspace.lints.clippy]
# The gate is `cargo clippy ... -- -D warnings` (CI, rebase-main, ship), so every
# lint enabled here must be at zero — otherwise `-D warnings` turns it into a build
# error. Only fixed/clean lints live here. The not-yet-zero "ratchet" lints are
# deliberately NOT listed (they stay clippy-default `allow`); they're tracked as a
# trend by the "Lint ratchet" CI step, which enables them explicitly with `-W`.
all = { level = "deny", priority = -1 }

# Readability lints driven to zero by the cleanup pass. A regression fails the build.
uninlined_format_args = "deny"
map_unwrap_or = "deny"
single_match_else = "deny"
redundant_closure_for_method_calls = "deny"
explicit_iter_loop = "deny"
if_not_else = "deny"
redundant_else = "deny"
unnested_or_patterns = "deny"
manual_let_else = "deny"
items_after_statements = "deny"
semicolon_if_nothing_returned = "deny"

# Ratchet (tracked, NOT gated — see the CI step and CLAUDE.md). Both are
# structural; they shrink via hotspot Linear issues, not lint-grinding. Promote to a
# deny above if one ever reaches zero:
#   too_many_lines  cognitive_complexity
#
# Evaluated and intentionally NOT tracked — both fire mostly on deliberate patterns
# here, not real debt:
#   match_same_arms — ~75% are exhaustive AST-visitor dispatch arms (walk_expr/
#     walk_stmt/…), the "big match dispatcher" carve-out in CLAUDE.md.
#   needless_pass_by_value — 38/56 are owned args threaded through the &mut self
#     inference chain (cloned once at the head regardless); the rest are fn-pointer
#     map_err mappers and idiomatic by-value CLI handlers.
