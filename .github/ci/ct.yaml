# chart-testing configuration. Kept beside the workflow rather than at the repo
# root so it is obvious which job reads it.
chart-dirs:
  - charts
target-branch: main
# Pinned rather than the random per-install namespace ct defaults to: the chart
# uses a stable namespace for the install and upgrade probes.
# ct uninstalls the release between files, so installs still do not overlap.
namespace: chart-ci
# The chart carries its own `helm test` hooks; `ct install` runs them after each
# install. The workflow checks upgrade behavior across a version bump separately.
upgrade: false
helm-extra-args: --timeout 5m
