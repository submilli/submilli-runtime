name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing published release tag (e.g. v0.1.0)"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUBMILLI_TELEMETRY: "0"
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  prepare:
    name: Resolve published release
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Verify release exists and is published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "false"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}

      - name: Resolve exact source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # Linux builds are static musl via cargo-zigbuild so the binaries run
          # without depending on the host distro's glibc version.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install zig
        if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --locked --release --target ${{ matrix.target }} \
              --bin submilli --bin submilli-server
          else
            cargo build --locked --release --target ${{ matrix.target }} \
              --bin submilli --bin submilli-server
          fi

      - name: Stage executables
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p artifacts
          EXT=""
          if [[ "$TARGET" == *windows* ]]; then
            EXT=".exe"
          fi
          for BIN in submilli submilli-server; do
            cp "target/$TARGET/release/$BIN$EXT" "artifacts/$BIN-$TARGET$EXT"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0

  docker:
    name: Validate and publish container image
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Before the artifacts: without a checkout there is no Dockerfile.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - uses: actions/download-artifact@v4
        with:
          pattern: "binaries-*-linux-musl"
          path: artifacts
          merge-multiple: true

      # Actions artifact downloads do not preserve executable permissions.
      - name: Lay out binaries by Docker architecture
        run: |
          mkdir -p dist/amd64 dist/arm64
          for BIN in submilli submilli-server; do
            install -m 755 "artifacts/$BIN-x86_64-unknown-linux-musl" "dist/amd64/$BIN"
            install -m 755 "artifacts/$BIN-aarch64-unknown-linux-musl" "dist/arm64/$BIN"
          done

      - uses: docker/metadata-action@v5
        id: meta
        with:
          # The image is named after the repository, matching compose.yaml,
          # the chart's values.yaml, and the Dockerfile's source label.
          images: ghcr.io/${{ github.repository }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}

      - uses: docker/setup-buildx-action@v3

      # Validate the runnable amd64 image and both platform layouts before
      # publishing the image and attaching executable assets to the release.
      #
      # `context: .` is not the default — the action would otherwise use the Git
      # context, which cannot see the untracked `dist/` this job just created.
      #
      # `provenance: false` because buildx otherwise attaches attestations that
      # add `unknown/unknown` entries to the manifest list.
      #
      # No QEMU anywhere: nothing is executed during a build, only copied.

      # `load: true` and a multi-platform `platforms:` list are mutually
      # exclusive — the docker daemon's image store cannot hold a multi-arch
      # manifest — which is why this step is the runner's own platform only.
      - name: Build the candidate for the runner's platform
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          tags: submilli-candidate:smoke
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ needs.prepare.outputs.commit }}

      # Verify both architectures from an OCI image archive before publication.
      - name: Export both platforms for structural checks
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          outputs: type=oci,dest=/tmp/submilli-image.tar
          tags: submilli-candidate:multi
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ needs.prepare.outputs.commit }}

      - name: Smoke test
        run: scripts/docker-smoke.sh submilli-candidate:smoke /tmp/submilli-image.tar

      # Runs second because it is the slower of the two and has more moving
      # parts: a broken image should fail on `--version`, not four minutes into a
      # restart test. This one reaches the network (an HTTPS GET proves the
      # bundled CA roots and musl's resolver), so a transport failure fails the
      # release rather than shipping an image that cannot reach anything.
      - name: Conformance
        run: scripts/docker-conformance.sh submilli-candidate:smoke

      # Authenticate only after the candidate passes its runtime checks.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the multi-arch manifest
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ needs.prepare.outputs.commit }}

  publish:
    name: Attach release executables and installers
    needs: [prepare, build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: artifacts
          merge-multiple: true

      - name: Upload executables, installers, and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp install.sh install.ps1 artifacts/
          cd artifacts
          assets=(
            submilli-x86_64-unknown-linux-musl
            submilli-x86_64-pc-windows-msvc.exe
            submilli-x86_64-apple-darwin
            submilli-aarch64-apple-darwin
            submilli-server-x86_64-unknown-linux-musl
            submilli-server-x86_64-pc-windows-msvc.exe
            submilli-server-x86_64-apple-darwin
            submilli-server-aarch64-apple-darwin
            install.sh
            install.ps1
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          sha256sum "${assets[@]}" > SHA256SUMS
          gh release upload "$RELEASE_TAG" "${assets[@]}" SHA256SUMS --clobber
