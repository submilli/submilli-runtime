name: Conformance

on:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUBMILLI_TELEMETRY: "0"
      SUBMILLI_SKIP_HTTP_TESTS: "1"
      SUBMILLI_CONFORMANCE_TEST: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: ECMA-262 conformance
        id: ecma
        run: cargo test --locked -p conformance --test conformance -- --nocapture
      - name: TypeScript conformance
        if: ${{ !cancelled() && (steps.ecma.outcome == 'success' || steps.ecma.outcome == 'failure') }}
        run: cargo test --locked -p conformance --test typescript -- --nocapture
