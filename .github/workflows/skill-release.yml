name: Skill release

# Merging a change to skills/submilli is the release: the pull request must
# raise skills/submilli/VERSION, and the merge publishes `skill-v<VERSION>`,
# which every `submilli skill sync` then installs.
on:
  pull_request:
    paths: ['skills/submilli/**']
  push:
    branches: [main]
    paths: ['skills/submilli/**']

permissions:
  contents: read

jobs:
  version-raised:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a higher skills/submilli/VERSION than the base branch
        run: |
          base=$(git show "origin/$GITHUB_BASE_REF:skills/submilli/VERSION" 2>/dev/null || echo 0)
          head=$(cat skills/submilli/VERSION)
          echo "base VERSION: $base, this change: $head"
          if [ "$head" -le "$base" ]; then
            echo "::error file=skills/submilli/VERSION::Skill files changed; raise VERSION above $base so the merge releases them."
            exit 1
          fi

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the release asset
        run: |
          version=$(cat skills/submilli/VERSION)
          echo "TAG=skill-v$version" >> "$GITHUB_ENV"
          python3 scripts/build_skill_release.py submilli-skill.json --expect-version "$version"
      - name: Publish
        # Releases are immutable snapshots: never move an existing tag.
        # Not "latest": install.sh resolves the CLI through releases/latest.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already published; nothing to do."
            exit 0
          fi
          gh release create "$TAG" submilli-skill.json \
            --target "$GITHUB_SHA" \
            --title "Submilli skill v${TAG#skill-v}" \
            --notes "Delivered automatically by \`submilli skill sync\`." \
            --latest=false
