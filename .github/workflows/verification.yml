name: Protocol verification

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The models read nothing in the repository outside verification/, so a
      # pull request or merge-queue entry that changes neither it nor this
      # workflow passes without running them. Every push to main and every
      # manual run checks them in full, so a failure on main, or a change in
      # the runner or Java, still shows. Each later step carries this guard.
      - name: Detect model changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          run=true
          if [ -n "$BASE_SHA" ] \
            && git fetch --no-tags --depth=1 "$SERVER/$REPO" "$BASE_SHA" \
            && git diff --quiet "$BASE_SHA" HEAD -- verification .github/workflows/verification.yml; then
            run=false
            echo "::notice::Neither verification/ nor this workflow changed; skipping the model checks."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.changes.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Check verification runner
        if: steps.changes.outputs.run == 'true'
        run: python3 -m unittest discover -s verification/tests -p 'test_*.py'
      - name: Check safety, progress, negative variants and reachable crash paths
        if: steps.changes.outputs.run == 'true'
        run: python3 verification/check.py --output "$RUNNER_TEMP/durability-model"
      - name: Check restart recovery and explicit resume
        if: steps.changes.outputs.run == 'true'
        run: python3 verification/check.py --model durability/recovery --output "$RUNNER_TEMP/recovery-model"
      - name: Check application-tool callbacks and resume retries
        if: steps.changes.outputs.run == 'true'
        run: python3 verification/check.py --model durability/tools --output "$RUNNER_TEMP/tools-model"
      - name: Check run preparation and admission
        if: steps.changes.outputs.run == 'true'
        run: python3 verification/check.py --model admission --output "$RUNNER_TEMP/admission-model"
      - name: Check filesystem operation journal
        if: steps.changes.outputs.run == 'true'
        run: python3 verification/check.py --model effects --output "$RUNNER_TEMP/effects-model"
      - name: Durable unit of work model
        if: steps.changes.outputs.run == 'true'
        run: python3 verification/check.py --model unit-of-work --output "$RUNNER_TEMP/unit-of-work-model"
      - name: Check byte writes without a filesystem journal
        if: steps.changes.outputs.run == 'true'
        run: python3 verification/check.py --model filesystem/writes --output "$RUNNER_TEMP/writes-model"
      - name: Check effect-history object publication and collection
        if: steps.changes.outputs.run == 'true'
        run: python3 verification/check.py --model history-objects --output "$RUNNER_TEMP/history-objects-model"
      - name: Check captured file updates
        if: steps.changes.outputs.run == 'true'
        run: python3 verification/check.py --model filesystem/updates --output "$RUNNER_TEMP/updates-model"
      - name: Check fixed-offset append recovery
        if: steps.changes.outputs.run == 'true'
        run: python3 verification/check.py --model filesystem --output "$RUNNER_TEMP/filesystem-model"
      - name: Check regular-file namespace recovery
        if: steps.changes.outputs.run == 'true'
        run: python3 verification/check.py --model filesystem/namespace --output "$RUNNER_TEMP/namespace-model"
      - name: Check directory recovery
        if: steps.changes.outputs.run == 'true'
        run: python3 verification/check.py --model filesystem/directories --output "$RUNNER_TEMP/directories-model"
      - name: Check staged writer outputs without input storage
        if: steps.changes.outputs.run == 'true'
        run: python3 verification/check.py --model filesystem/writers --output "$RUNNER_TEMP/writers-model"
      - name: Check listing handles across execution replay
        if: steps.changes.outputs.run == 'true'
        run: python3 verification/check.py --model filesystem/listings --output "$RUNNER_TEMP/listings-model"
      - name: Check reader handles across execution replay
        if: steps.changes.outputs.run == 'true'
        run: python3 verification/check.py --model filesystem/resources --output "$RUNNER_TEMP/resources-model"
      - name: Check caller-code filesystem replay
        if: steps.changes.outputs.run == 'true'
        run: python3 verification/check.py --model filesystem/sequences --output "$RUNNER_TEMP/sequences-model"
      - name: Check download admission and effect completion
        if: steps.changes.outputs.run == 'true'
        run: python3 verification/check.py --model filesystem/downloads --output "$RUNNER_TEMP/downloads-model"
      - name: Check public-file quota accounting across retries
        if: steps.changes.outputs.run == 'true'
        run: python3 verification/check.py --model filesystem/quotas --output "$RUNNER_TEMP/quotas-model"
      - name: Preserve model-checking evidence
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: durability-model
          path: |
            ${{ runner.temp }}/durability-model
            ${{ runner.temp }}/recovery-model
            ${{ runner.temp }}/tools-model
            ${{ runner.temp }}/admission-model
            ${{ runner.temp }}/effects-model
            ${{ runner.temp }}/unit-of-work-model
            ${{ runner.temp }}/filesystem-model
            ${{ runner.temp }}/writes-model
            ${{ runner.temp }}/downloads-model
            ${{ runner.temp }}/updates-model
            ${{ runner.temp }}/history-objects-model
            ${{ runner.temp }}/namespace-model
            ${{ runner.temp }}/directories-model
            ${{ runner.temp }}/writers-model
            ${{ runner.temp }}/resources-model
            ${{ runner.temp }}/listings-model
            ${{ runner.temp }}/sequences-model
            ${{ runner.temp }}/quotas-model
          if-no-files-found: ignore
          retention-days: 14
