name: Publish engine

# Publishes `submilli-engine` to crates.io. The release workflow calls this with
# its tagged commit; started by hand, it publishes from main. The `crates-io`
# environment holds the token, takes only main and `v*` tags, and waits for a
# reviewer before the job runs.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact runtime release commit
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    concurrency:
      group: publish-engine
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1

      # The engine takes the workspace version, so a rerun, or a release cut
      # after the same version was published by hand, finds it already there.
      - name: Check whether this version is published
        id: version
        run: |
          version=$(cargo metadata --format-version 1 --no-deps --locked \
            | jq -r '.packages[] | select(.name == "submilli-engine") | .version')
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A 'submilli-runtime-ci (https://github.com/submilli/submilli-runtime)' \
            "https://crates.io/api/v1/crates/submilli-engine/$version")
          echo "submilli-engine $version: crates.io answered $status"
          if [ "$status" = 200 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # Fail before uploading anything if the package does not build from its
      # packaged files alone.
      - name: Package
        if: steps.version.outputs.published != 'true'
        run: cargo publish --dry-run --locked -p submilli-engine

      - name: Publish
        if: steps.version.outputs.published != 'true'
        run: cargo publish --locked -p submilli-engine
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
