name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-site/**"
      - "examples/quickstart/**"
      - "scripts/docker-compose-e2e.sh"
      - "scripts/check_compose_release.py"
      - "scripts/publish_chart.py"
      - "scripts/tests/test_check_compose_release.py"
      - "scripts/tests/test_publish_chart.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "docs-site/**"
      - "examples/quickstart/**"
      - "scripts/docker-compose-e2e.sh"
      - "scripts/check_compose_release.py"
      - "scripts/publish_chart.py"
      - "scripts/tests/test_check_compose_release.py"
      - "scripts/tests/test_publish_chart.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-e2e:
    name: Compose documentation journey
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check Compose release gating
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_check_compose_release.py'
          python3 -m unittest discover -s scripts/tests -p 'test_publish_chart.py'
      - name: Check the documented runtime image
        id: image
        run: python3 scripts/check_compose_release.py
      - name: Replay the published Compose deployment
        if: steps.image.outputs.available == 'true'
        run: scripts/docker-compose-e2e.sh

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Check built documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          fail: true
          failIfEmpty: true
          args: >-
            --config ${{ github.workspace }}/docs-site/lychee.toml
            --extensions html
            --root-dir ${{ github.workspace }}/docs-site/dist
            --remap '^https://submilli\.ai/docs([?#].*)?$ file://${{ github.workspace }}/docs-site/dist/docs/$1'
            --remap '^https://submilli\.ai/docs/(.*)$ file://${{ github.workspace }}/docs-site/dist/docs/$1'
            --remap '^https://github\.com/submilli/submilli-runtime/edit/main/(.*)$ file://${{ github.workspace }}/$1'
            --remap '^https://github\.com/submilli/submilli-runtime/blob/main/(.*)$ file://${{ github.workspace }}/$1'
            ${{ github.workspace }}/docs-site/dist/docs
      - name: Test link-check failure cases
        working-directory: docs-site
        run: npm run check:links:fixtures
        env:
          LYCHEE_BIN: lychee
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: docs-site/dist/
          if-no-files-found: error
      - name: Report the hosted preview
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          notice() {
            echo "::notice::$1"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
          }
          if [ "$IS_FORK" = "true" ]; then
            notice "Hosted previews are only posted for branches in this repository. Reviewers can download the documentation-site artifact from this run instead."
            exit 0
          fi
          suffix=" - submilli-docs PR #${PR_NUMBER}"
          if ! deployments=$(gh api "repos/${REPOSITORY}/deployments?sha=${HEAD_SHA}&per_page=100"); then
            notice "Could not list this commit's deployments, so the hosted preview state is unknown. The Hosted preview link workflow posts the link on the pull request when Render finishes."
          elif jq -e --arg suffix "$suffix" 'any(.environment // "" | endswith($suffix))' <<< "$deployments" >/dev/null; then
            notice "Render has a preview deployment for this commit; the Hosted preview link workflow posts the link on the pull request when it succeeds."
          else
            notice "No Render preview deployment was found for this commit. If Pull Request Previews are not enabled on the submilli-docs service on Render, see docs-site/README.md, section 'Pull request previews', for the one-time setup. Until a preview exists, download the documentation-site artifact from this run."
          fi
