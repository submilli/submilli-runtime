name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Check built documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          fail: true
          failIfEmpty: true
          args: >-
            --config ${{ github.workspace }}/docs-site/lychee.toml
            --extensions html
            --root-dir ${{ github.workspace }}/docs-site/dist
            --remap '^https://submilli\.ai/docs([?#].*)?$ file://${{ github.workspace }}/docs-site/dist/docs/$1'
            --remap '^https://submilli\.ai/docs/(.*)$ file://${{ github.workspace }}/docs-site/dist/docs/$1'
            --remap '^https://github\.com/submilli/submilli-runtime/edit/main/(.*)$ file://${{ github.workspace }}/$1'
            ${{ github.workspace }}/docs-site/dist/docs
      - name: Test link-check failure cases
        working-directory: docs-site
        run: npm run check:links:fixtures
        env:
          LYCHEE_BIN: lychee
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: docs-site/dist/
          if-no-files-found: error
