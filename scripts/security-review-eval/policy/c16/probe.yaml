kind: blueprint
name: records-policy
packages: ["@pied-piper/records"]
default: deny
permissions:
  main:
    - capability: pied-piper.deliver
      action: allow
      filter: source == "/secret" and destination == "/trusted"
  '@pied-piper/records':
    - capability: fs.write
      action: allow
    - capability: fs.read
      action: allow
