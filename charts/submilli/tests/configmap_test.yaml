suite: blueprint seeding
templates:
  - configmap-blueprints.yaml
  - statefulset.yaml
tests:
  - it: renders no ConfigMap when no blueprints are configured
    template: configmap-blueprints.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: gives every blueprint a .yaml key regardless of what the operator wrote
    template: configmap-blueprints.yaml
    set:
      blueprints:
        demo: |
          name: demo
          default: deny
        reporting: |
          name: reporting
          default: deny
    asserts:
      # The server's seed scan filters on the extension. The natural values
      # shape (`blueprints: { demo: ... }`) would otherwise mount as
      # `/etc/submilli/blueprints/demo`, get skipped, and produce a server that
      # boots clean with no blueprints and no diagnostic. Templating the suffix
      # removes the operator's ability to get it wrong.
      - exists:
          path: data["demo.yaml"]
      - exists:
          path: data["reporting.yaml"]
      - notExists:
          path: data["demo"]

  - it: passes each blueprint through unchanged
    template: configmap-blueprints.yaml
    set:
      blueprints:
        demo: |
          name: demo
          default: deny
          vfs:
            mode: ephemeral
    asserts:
      - equal:
          path: data["demo.yaml"]
          value: |
            name: demo
            default: deny
            vfs:
              mode: ephemeral

  - it: mounts two blueprints through a single volume
    template: statefulset.yaml
    set:
      blueprints:
        demo: |
          name: demo
          default: deny
        reporting: |
          name: reporting
          default: deny
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: blueprints
            configMap:
              name: RELEASE-NAME-submilli-blueprints
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: blueprints
            mountPath: /etc/submilli/blueprints
            readOnly: true

  - it: keeps the read-only seed and the writable store apart
    template: statefulset.yaml
    set:
      blueprints:
        demo: |
          name: demo
          default: deny
    asserts:
      # Two different directories. Pointing both at one path would make the
      # store read-only forever — the defect this separation exists to
      # avoid.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SUBMILLI_BLUEPRINT_SEED_DIR
            value: /etc/submilli/blueprints
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: state
            mountPath: /var/lib/submilli

  - it: rolls the pod when a blueprint changes
    template: statefulset.yaml
    # Pinned so a release bumping either version does not move the hash: the
    # ConfigMap carries both the chart and the appVersion label, so the digest
    # would otherwise change for a reason that has nothing to do with the
    # property under test.
    chart:
      version: 0.0.0-unittest
      appVersion: 0.0.0-unittest
    set:
      blueprints:
        demo: |
          name: demo
          default: deny
    asserts:
      # Pinned rather than regex-matched, and paired with the differing value in
      # the next test: together they prove the annotation is derived from the
      # ConfigMap's content rather than being a constant. Without a rollout
      # trigger, a `helm upgrade` that changes only ConfigMap data leaves the
      # StatefulSet spec identical, so no rollout happens and the running pod
      # keeps the old blueprints.
      #
      # Expect these to change if configmap-blueprints.yaml's rendered output
      # changes. That is the test doing its job, not a flake: re-run
      # `helm unittest charts/submilli` and copy the reported `Actual:` digests
      # here. Moving with no template change means something unpinned is
      # reaching the digest — fix that instead.
      - equal:
          path: spec.template.metadata.annotations["checksum/blueprints"]
          value: 91807f9ebd077d621dddd64793db7678069ed19dbc23be163dc41a8b55035bde

  - it: produces a different rollout trigger for different blueprint content
    template: statefulset.yaml
    # Pinned so a release bumping either version does not move the hash: the
    # ConfigMap carries both the chart and the appVersion label, so the digest
    # would otherwise change for a reason that has nothing to do with the
    # property under test.
    chart:
      version: 0.0.0-unittest
      appVersion: 0.0.0-unittest
    set:
      blueprints:
        demo: |
          name: demo
          default: allow
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/blueprints"]
          value: 5b7a710b06b1aa16b72809392b9d560abaa4597295fcab0bc0f4048aa27a23bc
