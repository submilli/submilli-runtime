suite: encrypted secret store
templates:
  - secret-store.yaml
  - statefulset.yaml
  - configmap-config.yaml
kubernetesProvider:
  scheme:
    v1/Secret:
      gvr:
        version: v1
        resource: secrets
      namespaced: true
tests:
  - it: generates and retains an encryption key by default
    template: secret-store.yaml
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-submilli-secret-store
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - matchRegex:
          path: data.key
          decodeBase64: true
          pattern: '^[A-Za-z0-9+/]{43}=$'

  - it: mounts the generated key and configures its file
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: secret-store-key
            secret:
              secretName: RELEASE-NAME-submilli-secret-store
              items:
                - key: key
                  path: key
        template: statefulset.yaml
      - matchRegex:
          path: data["server.yaml"]
          pattern: '(?m)^secret_store:\n +key_file: /etc/submilli/secret-store/key$'
        template: configmap-config.yaml

  - it: reuses the encryption key on upgrade
    template: secret-store.yaml
    release:
      namespace: default
      isUpgrade: true
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: RELEASE-NAME-submilli-secret-store
            namespace: default
          data:
            key: QndjSEJ3Y0hCd2NIQndjSEJ3Y0hCd2NIQndjSEJ3Y0hCd2NIQndjSEJ3Yz0=
    asserts:
      - equal:
          path: data.key
          value: QndjSEJ3Y0hCd2NIQndjSEJ3Y0hCd2NIQndjSEJ3Y0hCd2NIQndjSEJ3Yz0=

  - it: refuses an existing Secret with a missing key
    template: secret-store.yaml
    release:
      namespace: default
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: RELEASE-NAME-submilli-secret-store
            namespace: default
          data:
            other: QndjSEJ3Y0hCd2NIQndjSEJ3Y0hCd2NIQndjSEJ3Y0hCd2NIQndjSEJ3Yz0=
    asserts:
      - failedTemplate:
          errorPattern: 'restore the original key'

  - it: refuses an invalid existing key
    template: secret-store.yaml
    release:
      namespace: default
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: RELEASE-NAME-submilli-secret-store
            namespace: default
          data:
            key: c2hvcnQ=
    asserts:
      - failedTemplate:
          errorPattern: 'base64-encoded 32-byte encryption key'

  - it: honors an external Secret and custom key
    set:
      secretStore:
        existingSecret: external-store-key
        key: encryption-key
    asserts:
      - hasDocuments:
          count: 0
        template: secret-store.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: secret-store-key
            secret:
              secretName: external-store-key
              items:
                - key: encryption-key
                  path: encryption-key
        template: statefulset.yaml
      - matchRegex:
          path: data["server.yaml"]
          pattern: '(?m)^secret_store:\n +key_file: /etc/submilli/secret-store/encryption-key$'
        template: configmap-config.yaml

  - it: disables key generation and store configuration explicitly
    set:
      secretStore.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: secret-store.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: secret-store-key
          any: true
        template: statefulset.yaml
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: secret-store-key
          any: true
        template: statefulset.yaml
      - notMatchRegex:
          path: data["server.yaml"]
          pattern: secret_store
        template: configmap-config.yaml

  - it: bounds generated resource names
    template: secret-store.yaml
    set:
      fullnameOverride: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - equal:
          path: metadata.name
          value: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-secret-store

  - it: uses the configured key name for generated Secrets
    template: secret-store.yaml
    set:
      secretStore.key: encryption-key
    asserts:
      - exists:
          path: data["encryption-key"]
      - notExists:
          path: data.key
