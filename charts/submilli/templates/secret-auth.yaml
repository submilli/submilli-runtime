{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- $name := include "submilli.authSecretName" . -}}
{{/*
Generated once, then carried forward. Helm re-renders every template on every
upgrade, so a bare `randAlphaNum` would rotate both tokens each time and lock
out every caller as a side effect of an unrelated change. Reading the live
Secret back and reusing what is there makes the random value a first-install
default only.

Per key rather than all-or-nothing, so renaming one key (or an operator
deleting one to force its rotation) regenerates that token and leaves the other
alone.

`lookup` returns nothing under `helm template` and `--dry-run=client`, which is
also how Argo CD renders: there the tokens would change on every sync. Those
flows must set `auth.existingSecret`; the chart README says so.
*/}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "submilli.labels" . | nindent 4 }}
  annotations:
    # Survives `helm uninstall`, like the state volume. The tokens are handed to
    # callers out of band, so a reinstall that minted new ones would break every
    # one of them; with the Secret kept, the reinstall adopts it and `lookup`
    # above finds the same values.
    helm.sh/resource-policy: keep
type: Opaque
data:
  # 48 alphanumerics: ~285 bits, and inside the server's token alphabet with
  # room over its 32-character floor.
  {{- range $key := list .Values.auth.adminTokenKey .Values.auth.userTokenKey }}
  {{ $key }}: {{ get $existing $key | default (randAlphaNum 48 | b64enc) | quote }}
  {{- end }}
{{- end }}
