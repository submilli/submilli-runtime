{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "submilli.serviceAccountName" . }}
  labels:
    {{- include "submilli.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No RoleBinding anywhere in this chart, deliberately. The server never talks to
# the Kubernetes API, so this identity should be worth nothing to hold. Combined
# with `automountServiceAccountToken: false` on the pod, a filesystem read from
# inside the sandbox finds no token, and a token obtained some other way grants
# no permissions.
automountServiceAccountToken: false
{{- end }}
