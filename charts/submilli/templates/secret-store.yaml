{{- if and .Values.secretStore.enabled (not .Values.secretStore.existingSecret) -}}
{{- $name := include "submilli.secretStoreSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $key := .Values.secretStore.key -}}
{{- $data := "" -}}
{{- if $existing -}}
{{-   $data = get ($existing.data | default dict) $key | default "" -}}
{{-   $encoded := $data | b64dec | trim -}}
{{-   $decoded := $encoded | b64dec -}}
{{-   if or (ne (len $decoded) 32) (ne ($decoded | b64enc) $encoded) -}}
{{-     fail (printf "Secret %s must contain a base64-encoded 32-byte encryption key in %s; restore the original key to preserve access to stored secrets" $name $key) -}}
{{-   end -}}
{{- else -}}
{{/* randBytes returns base64 text; Kubernetes data needs one more encoding. */}}
{{-   $data = randBytes 32 | b64enc -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "submilli.labels" . | nindent 4 }}
  annotations:
    # The encrypted data volume outlives a release; its key must outlive it too.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ $data | quote }}
{{- end }}
