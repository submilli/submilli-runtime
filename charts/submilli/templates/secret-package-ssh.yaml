{{- if not .Values.packageSsh.existingSecret }}
{{- $name := include "submilli.packageSshSecretName" . -}}
{{/*
The ed25519 key `server packages install` authenticates to GitHub with for
private repositories. Generated unless `packageSsh.existingSecret` names the
operator's own Secret: the server reads it through `package_ssh_key_file`, and
operators add its public half to a repository as a deploy key (`submilli
server packages ssh-key` prints it). The private key never leaves this Secret
and the pod.

Generated once, then carried forward, like the auth tokens: a key that rotated
on every upgrade would silently revoke the deploy key registered for it.
`lookup` returns nothing under `helm template` and `--dry-run=client`, which is
also how Argo CD renders, so there the key would change on every sync. Those
flows must set `packageSsh.existingSecret`; the chart README says so.

PKCS#8 PEM, which is what `genPrivateKey "ed25519"` emits and the server reads.
*/}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
{{- $key := .Values.packageSsh.key -}}
{{- $current := get $existing $key -}}
{{- /*
Renaming `packageSsh.key` keeps the key it already holds: a new name is not a
reason to revoke the deploy key registered for the old one.
*/ -}}
{{- if and (not $current) $existing -}}
{{-   $current = first (values $existing) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "submilli.labels" . | nindent 4 }}
  annotations:
    # Survives `helm uninstall`, like the state volume, so a reinstall adopts
    # the same key and the deploy keys registered for it keep working.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key | quote }}: {{ $current | default (genPrivateKey "ed25519" | b64enc) | quote }}
{{- end }}
