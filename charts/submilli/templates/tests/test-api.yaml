{{- $fullname := include "submilli.fullname" . -}}
{{/* Pod 0 by name through the headless Service, not the load-balanced one.
     Replicas share nothing, so a round-robin Service would register the probe
     blueprint on one server and then assert against another. */}}
{{- $base := printf "http://%s-0.%s:%v" $fullname (include "submilli.headlessName" .) .Values.server.port -}}
{{- $execProbe := printf "%s-helmtest-exec" $fullname | trunc 63 | trimSuffix "-" -}}

{{/*
The probe blueprint the execute check runs against. Created by the test and
deleted on exit, so this check works on a default install with no blueprints
configured — which is the install where the /tmp failure mode below actually
bites.
*/}}
{{- $execYaml := printf "name: %s\ndefault: deny\nvfs:\n  mode: ephemeral\npermissions:\n  main:\n    - capability: fs.write\n      action: allow\n    - capability: fs.read\n      action: allow\n" $execProbe -}}
{{/*
`readText` returns `string | null`, and `!` here is a runtime-checked narrowing
rather than TypeScript's unchecked assertion — on null it throws, which is the
behaviour this test wants.
*/}}
{{- $program := "import { readText, writeText } from \"submilli:fs\";\n\nexport function main(): string {\n  writeText(\"/probe.txt\", \"helm-test-ok\");\n  return readText(\"/probe.txt\")!;\n}\n" -}}

apiVersion: v1
kind: Pod
metadata:
  name: {{ $fullname }}-test-api
  labels:
    {{- include "submilli.labels" . | nindent 4 }}
    # Load-bearing, not decoration: the NetworkPolicy's allowlist rule keys on
    # this exact label plus the release instance. Remove it and this pod is
    # blocked by the same policy it is here to prove works.
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    # Runs before the NetworkPolicy probe, so a broken server surfaces as "the
    # API is broken" rather than as a confusing pass on a test whose whole
    # premise is that the API is reachable.
    helm.sh/hook-weight: "1"
    # Deleted on success, and on the next run if it failed — so a failed pod
    # stays around for `kubectl logs` while a successful one does not linger.
    # That matters here beyond tidiness: this pod mounts the admin token and,
    # unlike the distroless server, has a shell. Retaining it
    # after a green run would leave operator secret material sitting in a pod
    # anyone with `pods/exec` could read, indefinitely.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: {{ .Values.tests.runAsUser }}
    runAsGroup: {{ .Values.tests.runAsGroup }}
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
        {{- if .Values.auth.enabled }}
        - name: auth
          mountPath: {{ include "submilli.authMountPath" . }}
          readOnly: true
        {{- end }}
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu

          BASE="{{ $base }}"
          CURL="curl -sS --connect-timeout 5 --max-time 30"

          # The admin token, because registering and deleting the probe
          # blueprint are admin routes. It reaches curl through a config file
          # rather than `-H`: a header on the command line is in argv, which
          # anything that can list processes on the node can read. `printf` is
          # a shell builtin, so writing the file does not put it there either.
          # Whitespace is stripped because the server trims it on read, and an
          # operator's own Secret may well end in a newline.
          AUTH=""
          {{- if .Values.auth.enabled }}
          umask 077
          TOKEN=$(tr -d '[:space:]' <{{ include "submilli.authMountPath" . }}/{{ .Values.auth.adminTokenKey }})
          [ -n "$TOKEN" ] || { echo "FAIL: the admin token in Secret {{ include "submilli.authSecretName" . }} is empty" >&2; exit 1; }
          printf 'header = "Authorization: Bearer %s"\n' "$TOKEN" >/tmp/auth.curlrc
          AUTH="-K /tmp/auth.curlrc"
          {{- end }}

          fail() {
            echo "FAIL: $*" >&2
            echo "--- last response body ---" >&2
            cat /tmp/body >&2 2>/dev/null || true
            echo >&2
            exit 1
          }

          # $1 method, $2 path, $3 optional JSON body file. Echoes the HTTP
          # status (000 if the connection never completed); body lands in
          # /tmp/body. Sends the admin token when auth is on.
          call() {
            if [ -n "${3:-}" ]; then
              code=$($CURL $AUTH -o /tmp/body -w '%{http_code}' -X "$1" \
                -H 'Content-Type: application/json' --data-binary "@$3" "$BASE$2") || true
            else
              code=$($CURL $AUTH -o /tmp/body -w '%{http_code}' -X "$1" "$BASE$2") || true
            fi
            [ -n "${code:-}" ] || code=000
            echo "$code"
          }

          # $1 path. A GET with no token, whatever the auth setting: what the
          # kubelet's probe and an uninvited caller both look like.
          anonymous() {
            code=$($CURL -o /tmp/body -w '%{http_code}' "$BASE$1") || true
            [ -n "${code:-}" ] || code=000
            echo "$code"
          }

          CREATED_EXEC=0
          cleanup() {
            if [ "$CREATED_EXEC" = 1 ]; then
              $CURL $AUTH -o /dev/null -X DELETE "$BASE/v1/blueprints/{{ $execProbe }}" || true
            fi
            return 0
          }
          trap cleanup EXIT

          # `helm test` does not imply the pod is ready, so poll rather than
          # assume. 60 x 2s comfortably outlasts the startupProbe's budget.
          #
          # /healthz without a token, which is exactly the request the pod's
          # own probes make — so this also proves the probe route is public.
          echo "==> waiting for $BASE/healthz"
          i=0
          while [ "$(anonymous /healthz)" != "200" ]; do
            i=$((i + 1))
            [ "$i" -lt 60 ] || fail "/healthz never returned 200 after 120s"
            sleep 2
          done
          echo "ok: GET /healthz needs no token"

          {{- if .Values.auth.enabled }}

          # Both directions. A server that answers everyone and a server that
          # rejects the chart's own token each leave one of these green, and
          # each is a broken deployment: the first is open, the second is
          # unusable by the callers this token was handed to.
          code=$(anonymous /v1/status)
          [ "$code" = "401" ] || fail "GET /v1/status without a token returned $code, expected 401 — the server is not enforcing authentication"
          echo "ok: GET /v1/status is refused without a token"

          code=$(call GET /v1/status)
          [ "$code" = "200" ] || fail "GET /v1/status with the admin token returned $code — the token in Secret {{ include "submilli.authSecretName" . }} is not one the server accepts. Tokens are read at boot: if the Secret changed since, restart the pod"
          echo "ok: GET /v1/status accepts the admin token"
          {{- end }}

          cat >/tmp/exec-bp.json <<'JSON'
          {{ dict "yaml" $execYaml | toJson }}
          JSON
          code=$(call POST /v1/blueprints /tmp/exec-bp.json)
          [ "$code" = "200" ] || fail "could not register the probe blueprint (HTTP $code)"
          CREATED_EXEC=1
          echo "ok: registered probe blueprint {{ $execProbe }}"

          # The point of this test. A server whose ephemeral VFS root is not
          # writable answers /healthz perfectly happily and fails every
          # execute, so health alone would call that deployment green. The
          # program writes and reads a file to exercise the VFS rather than
          # merely reaching the interpreter.
          cat >/tmp/exec.json <<'JSON'
          {{ dict "code" $program "blueprint" $execProbe | toJson }}
          JSON
          code=$(call POST /v1/execute /tmp/exec.json)
          [ "$code" = "200" ] || fail "POST /v1/execute returned $code"
          grep -q '"result":"helm-test-ok"' /tmp/body \
            || fail "execute did not return the expected result — the VFS write/read round-trip failed"
          echo "ok: POST /v1/execute round-tripped a file through the VFS"

          echo
          echo "PASS"
  volumes:
    - name: tmp
      emptyDir: {}
    {{- if .Values.auth.enabled }}
    # The admin token alone; the test never acts as a `user`.
    - name: auth
      secret:
        secretName: {{ include "submilli.authSecretName" . }}
        items:
          - key: {{ .Values.auth.adminTokenKey }}
            path: {{ .Values.auth.adminTokenKey }}
    {{- end }}
