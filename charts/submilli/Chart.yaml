apiVersion: v2
name: submilli
description: Agent-native execution environment — runs a strict TypeScript subset in a WasmGC sandbox with capability-based security.
type: application

# Chart packaging version. Bump on every chart change: OCI pushes are immutable
# by convention, and `ct lint` fails a PR that edits the chart without it.
version: 0.1.1

# The submilli-server release this chart deploys, and the default image tag.
#
# The floor is v0.1.4: it is the first release carrying `--blueprint-seed-dir`,
# which templates/configmap-blueprints.yaml depends on. Pinning an earlier tag
# produces a server that boots clean and ignores every seeded blueprint.
appVersion: "0.1.4"

# `readOnlyRootFilesystem`, `seccompProfile`, and the Pod Security Standards
# "restricted" profile the pod spec targets all stabilised by 1.25. Helm enforces
# this at install and upgrade.
kubeVersion: ">=1.25.0-0"

home: https://github.com/submilli/submilli
sources:
  - https://github.com/submilli/submilli
keywords:
  - submilli
  - sandbox
  - agent
  - typescript
  - webassembly
maintainers:
  - name: Submilli
    url: https://github.com/submilli

annotations:
  # Links the published package to the repo so it inherits its permissions,
  # matching what the Dockerfile does for the image.
  org.opencontainers.image.source: https://github.com/submilli/submilli
